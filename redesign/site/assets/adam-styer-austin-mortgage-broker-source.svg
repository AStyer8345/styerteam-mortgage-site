<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="title desc">
  <title id="title">Adam Styer, Austin mortgage broker</title>
  <desc id="desc">Portrait of Adam Styer against a navy and gold Austin architectural background.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09182E" stop-opacity=".3"/>
      <stop offset=".62" stop-color="#0D2342" stop-opacity=".08"/>
      <stop offset="1" stop-color="#D1B568" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="46%">
      <stop stop-color="#D1B568" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#D1B568" stop-opacity=".06"/>
      <stop offset="1" stop-color="#D1B568" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".68" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="portraitMask"><rect width="1200" height="1200" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020A13" flood-opacity=".5"/>
    </filter>
  </defs>

  <image href="og-background.png" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="1200" fill="url(#wash)"/>
  <circle cx="600" cy="470" r="480" fill="url(#halo)"/>
  <circle cx="600" cy="480" r="382" fill="#0A1F3F" fill-opacity=".2" stroke="#D1B568" stroke-opacity=".38" stroke-width="3"/>
  <path d="M120 160h180l300-176 300 176h180" fill="none" stroke="#D1B568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".84"/>
  <path d="M190 220h138l272-160 272 160h138" fill="none" stroke="#F2C840" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/>
  <ellipse cx="600" cy="1082" rx="370" ry="52" fill="#020A13" opacity=".42" filter="url(#shadow)"/>
  <image href="adam-cutout-900.png" x="150" y="192" width="900" height="900" preserveAspectRatio="xMidYMid meet" mask="url(#portraitMask)"/>
  <path d="M62 62h150M62 62v150M1138 988v150M988 1138h150" fill="none" stroke="#D1B568" stroke-width="5" stroke-linecap="round" opacity=".75"/>
</svg>
