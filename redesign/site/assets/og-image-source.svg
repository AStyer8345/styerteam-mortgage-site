<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Adam Styer — Austin mortgage strategy for complex income</title>
  <desc id="desc">A premium navy and gold Austin mortgage card featuring Adam Styer.</desc>
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#09182E" stop-opacity=".96"/>
      <stop offset=".54" stop-color="#09182E" stop-opacity=".82"/>
      <stop offset=".78" stop-color="#09182E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#09182E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="portraitFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".65" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="portraitMask">
      <rect width="1200" height="630" fill="url(#portraitFade)"/>
    </mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020A13" flood-opacity=".42"/>
    </filter>
  </defs>

  <image href="og-background.png" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#leftShade)"/>
  <rect x="0" y="0" width="14" height="630" fill="#F2C840"/>
  <path d="M62 82h108l35-21 35 21h108" fill="none" stroke="#D1B568" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="126" fill="#F5F1E8" font-size="24" font-weight="800" letter-spacing="4">ADAM STYER</text>
    <text x="62" y="165" fill="#D1B568" font-size="17" font-weight="700" letter-spacing="2.2">AUSTIN MORTGAGE BROKER</text>

    <text x="62" y="252" fill="#FFFFFF" font-size="57" font-weight="800" letter-spacing="-1.8">Mortgages built for</text>
    <text x="62" y="319" fill="#F2C840" font-size="57" font-weight="800" letter-spacing="-1.8">complex income.</text>

    <text x="62" y="380" fill="#DCE6F3" font-size="21" font-weight="500">Self-employed <tspan fill="#D1B568">•</tspan> Investor <tspan fill="#D1B568">•</tspan> Jumbo</text>

    <g transform="translate(62 427)">
      <rect width="502" height="74" rx="15" fill="#FFFFFF" fill-opacity=".08" stroke="#D1B568" stroke-opacity=".58"/>
      <text x="22" y="31" fill="#F5F1E8" font-size="18" font-weight="700">Strategy first. More ways to qualify.</text>
      <text x="22" y="55" fill="#AFC1D7" font-size="15">40+ lenders • 1,000+ closings</text>
    </g>

    <text x="62" y="572" fill="#D1B568" font-size="17" font-weight="700">STYERMORTGAGE.COM</text>
    <text x="62" y="600" fill="#9EB0C7" font-size="13">NMLS #513013</text>
  </g>

  <ellipse cx="756" cy="594" rx="230" ry="31" fill="#020A13" opacity=".36" filter="url(#shadow)"/>
  <image href="adam-cutout-900.png" x="500" y="27" width="548" height="548" preserveAspectRatio="xMidYMid meet" mask="url(#portraitMask)"/>
  <path d="M1020 44h116v116" fill="none" stroke="#D1B568" stroke-width="3" opacity=".72"/>
  <path d="M1053 44h83v83" fill="none" stroke="#F2C840" stroke-width="1" opacity=".72"/>
</svg>
